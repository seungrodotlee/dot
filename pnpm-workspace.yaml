packages:
  - "services/*/web-client"
  - "services/*/web-server"
  - "services/*/web"
  - "services/*/app"
  - "packages/*"
  - "configs/*"
  - "scripts"

allowBuilds:
  esbuild: false
  sharp: true

catalogs:
  tsdown:
    tsdown: ^0.22.7
  typescript7:
    typescript: ^7
  oxc:
    oxlint: ^1.73.0
    oxfmt: ^0.58.0
  next16:
    next: 16.2.10
  react19:
    react: 19.2.4
    react-dom: 19.2.4
    "@types/react": ^19
    "@types/react-dom": ^19

catalogMode: strict

catalog:
  '@cucumber/cucumber': ^13.0.0
  '@cucumber/gherkin': ^42.0.0
  '@cucumber/messages': ^34.2.0
  tsx: ^4.23.1
